name: Build IIIF Manifests

on:
  schedule:
    # Daily schedule
    - cron: "0 0 * * *"

  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache DLCS Image Information
        id: dlcs-cache
        uses: actions/cache@v4
        with:
          path: .cache/dlcs
          key: dlcs-${{ runner.os }}-${{ github.run_id }} # Can use time based key as well
          restore-keys: |
            dlcs-${{ runner.os }}

      - name: Delete previous cache
        run: gh cache delete dlcs-${{ runner.os }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i

      - name: Generate Manifests
        id: generate-manifests
        run: bun run generate --no-collective-access-cache

      - name: Upload generation log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generation-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/*.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit & push changes
        if: ${{ success() && steps.generate-manifests.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- build/iiif
          git diff-index --quiet HEAD || git commit -m "generated with github action"
          git push
